name: Release

on:
  push:
    tags:
      - '*-hubterm-v*'

permissions:
  contents: write

jobs:
  build-hubterm-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qtbase5-dev libqt5websockets5-dev

      - name: Configure HubTerm module
        run: cmake -S . -B build -DWINDTERM_BUILD_HUBTERM_ONLY=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build HubTerm module
        run: cmake --build build --config Release --parallel

  release:
    needs: build-hubterm-module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          echo "## WindTerm with HubTerm Agent" > release-notes.md
          echo "" >> release-notes.md
          echo "基于 WindTerm ${{ github.ref_name }} 集成 HubTerm Agent。" >> release-notes.md
          echo "" >> release-notes.md
          echo "### 新增功能" >> release-notes.md
          echo "- HubTerm Agent 集成（自发现/自上报/被管理/终端共享）" >> release-notes.md
          echo "- Pty 数据透传 hook" >> release-notes.md
          echo "" >> release-notes.md
          echo "### 分支" >> release-notes.md
          echo "- \`hubterm-v1\`: HubTerm 集成分支" >> release-notes.md
          echo "- \`master\`: 上游原始分支" >> release-notes.md
          echo "" >> release-notes.md
          echo "### 构建说明" >> release-notes.md
          echo "此仓库快照当前提供 HubTerm 集成模块的独立编译验证；完整 WindTerm 应用仍需要完整上游工程文件。" >> release-notes.md
          echo "需要 Qt 5.15+ (Core/Network/WebSockets) 和 CMake 3.16+" >> release-notes.md
          echo "" >> release-notes.md
          echo '```bash' >> release-notes.md
          echo "cmake -S . -B build -DWINDTERM_BUILD_HUBTERM_ONLY=ON" >> release-notes.md
          echo "cmake --build build --parallel" >> release-notes.md
          echo '```' >> release-notes.md

      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix=WindTerm-${{ github.ref_name }}/ \
            -o WindTerm-${{ github.ref_name }}-src.tar.gz HEAD

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            WindTerm-${{ github.ref_name }}-src.tar.gz
